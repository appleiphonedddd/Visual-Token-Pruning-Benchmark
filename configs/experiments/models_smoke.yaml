# Every model that fits a 12 GB GPU on a POPE subset (~5 min). Shows capability-based skipping:
# pooling needs grid_shape, which the anyres models (LLaVA-NeXT / OneVision) do not provide.
name: models_smoke
output_dir: outputs
seed: 0
models: [qwen2_5_vl_3b, internvl3_2b, llava_ov_0_5b, llava_1_5_7b_4bit, llava_next_7b_4bit]
datasets: [{config: pope, limit: 100}]
methods:
  - vanilla
  - {config: pooling, budgets: [64]}
  - {config: divprune, budgets: [64]}
  - {config: cdpruner, budgets: [64]}
generation: {max_new_tokens: 8}
